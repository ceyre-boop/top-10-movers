[project]
name = "top10"
version = "0.1.0"
description = "TOP10 — Daily Top-Movers Predictor (research vehicle)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
model = ["lightgbm>=4.3", "scikit-learn>=1.5"]
polygon = ["polygon-api-client>=1.14"]
databento = ["databento>=0.34"]
collect = ["robin_stocks>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["top10*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
