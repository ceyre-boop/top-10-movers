name: predict-live

# Two scheduled jobs:
#   - predict: 09:25 ET, T2 decision time -- writes+commits the day's
#     pre-committed prediction.
#   - score-and-monitor: 16:10 ET -- scores the day against the captured
#     Robinhood list + proxy label, then runs the rolling stop/kill
#     monitor. Fails the run (non-zero exit) when monitor returns STOP or
#     KILL, so a failed run IS the alert.
#
# DST-safe cron: America/New_York is UTC-5 (EST) Nov-Mar and UTC-4 (EDT)
# Mar-Nov. GitHub Actions cron only understands UTC, so each schedule is
# duplicated at both UTC offsets (14:25/13:25 for 09:25 ET, 21:10/20:10
# for 16:10 ET) and each job checks the actual current ET wall-clock time
# at runtime, exiting early (success, no-op) on the offset that doesn't
# currently apply. This is the standard two-cron-entries technique for a
# DST-safe local-time schedule on a UTC-only scheduler.

on:
  schedule:
    # 09:25 ET == 13:25 UTC (EDT) or 14:25 UTC (EST)
    - cron: "25 13 * * 1-5"
    - cron: "25 14 * * 1-5"
    # 16:10 ET == 20:10 UTC (EDT) or 21:10 UTC (EST)
    - cron: "10 20 * * 1-5"
    - cron: "10 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  predict:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '25 ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check current ET time matches this schedule's slot
        id: gate
        run: |
          hour=$(TZ="America/New_York" date +%H)
          minute=$(TZ="America/New_York" date +%M)
          echo "Current ET time: ${hour}:${minute}"
          if [ "$hour" = "09" ] && [ "$minute" -ge "20" ] && [ "$minute" -le "35" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -e '.[dev,model]'

      - name: Configure git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "top10-predict-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Predict for today
        if: steps.gate.outputs.run == 'true'
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          python -m top10.cli predict --date "$(TZ='America/New_York' date +%F)" --model-path models/current

      - name: Push commit
        if: steps.gate.outputs.run == 'true'
        run: git push

  score-and-monitor:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.schedule, '10 ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check current ET time matches this schedule's slot
        id: gate
        run: |
          hour=$(TZ="America/New_York" date +%H)
          minute=$(TZ="America/New_York" date +%M)
          echo "Current ET time: ${hour}:${minute}"
          if [ "$hour" = "16" ] && [ "$minute" -ge "05" ] && [ "$minute" -le "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -e '.[dev,model,collect]'

      - name: Configure git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "top10-predict-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Score prior day
        if: steps.gate.outputs.run == 'true'
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: |
          python -m top10.cli score --date "$(TZ='America/New_York' date +%F)"

      - name: Commit scoring record
        if: steps.gate.outputs.run == 'true'
        run: |
          git add data/scores || true
          git diff --cached --quiet || git commit -m "score: $(TZ='America/New_York' date +%F)"
          git push

      - name: Run rolling monitor
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m top10.cli monitor
