name: Collect Robinhood top movers

# docs/LABEL_SPEC.md "Proxy validation": at 16:05 ET, capture the real
# Robinhood top-movers list and store it raw, timestamped, unedited. There
# is no historical archive of this list — every missed day is a
# permanently lost data point, so this job must fail loudly rather than
# silently skip.
#
# DST-safe cron: matches the pattern already established in
# predict-live.yml (kept consistent deliberately -- two different DST
# techniques in one repo would be a maintenance trap). America/New_York is
# UTC-5 (EST) Nov-Mar and UTC-4 (EDT) Mar-Nov. GitHub Actions cron only
# understands UTC, so the schedule is duplicated at both UTC offsets
# (20:05/21:05 for 16:05 ET) and the job checks the actual current ET
# wall-clock time at runtime, no-op'ing (skipping the capture step) on
# whichever cron firing doesn't currently correspond to ~16:05 ET.
on:
  schedule:
    # 16:05 ET == 20:05 UTC (EDT) or 21:05 UTC (EST)
    - cron: "5 20 * * 1-5"
    - cron: "5 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check current ET time matches this schedule's slot
        id: gate
        run: |
          hour=$(TZ="America/New_York" date +%H)
          minute=$(TZ="America/New_York" date +%M)
          echo "Current ET time: ${hour}:${minute}"
          if [ "$hour" = "16" ] && [ "$minute" -ge "05" ] && [ "$minute" -le "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.11"

      - name: Install package (with [collect] extra)
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --upgrade pip && python -m pip install ".[collect]"

      - name: Capture Robinhood movers (true top-movers + S&P 500 context)
        id: capture
        if: steps.gate.outputs.run == 'true'
        run: python -m top10.collect.rh_movers --direction up

      - name: Diagnostic on failure (both feeds failed entirely)
        if: failure() && steps.capture.outcome == 'failure'
        run: |
          echo "::error::rh_movers capture FAILED — every fetch path for both feeds (robin_stocks SDK and direct HTTPS, for both the true Top Movers feed and the S&P 500 feed) was exhausted. This is a real alert: today's Robinhood top-movers list was NOT captured, and it can never be recovered after the fact (no historical archive exists). Check the 'Capture Robinhood movers' step's log above for the per-path failure reasons."
          exit 1

      - name: Report primary source (true top-movers) availability
        if: steps.capture.outcome == 'success'
        run: |
          FILE=$(git status --porcelain data/raw/rh_movers | awk '{print $2}' | grep -E '[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | head -n1)
          if [ -z "$FILE" ]; then
            echo "No new capture file this run (day's file already existed and was skipped, or nothing changed)."
          else
            python - "$FILE" <<'PY'
          import json, sys

          path = sys.argv[1]
          with open(path) as f:
              envelope = json.load(f)

          if envelope.get("top_movers_available"):
              print(f"OK: TRUE top-movers feed captured for {envelope.get('trade_date')}.")
          else:
              print(
                  "::warning::PRIMARY PROXY-VALIDATION SOURCE UNAVAILABLE for "
                  f"{envelope.get('trade_date')} — only the S&P 500 context feed was "
                  "captured. The TRUE Robinhood Top Movers list could not be fetched "
                  "today. See docs/LABEL_SPEC.md \"Proxy validation\"; per the plan's "
                  "§1.3 the remaining fallback is screenshot+OCR (not yet implemented)."
              )
          PY
          fi

      - name: Commit captured file (append-only)
        if: steps.capture.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git status --porcelain data/raw/rh_movers | grep -q .; then
            git add data/raw/rh_movers
            git commit -m "collect: rh_movers capture $(TZ='America/New_York' date +%F)"
            git push
          else
            echo "No new capture file to commit (day's file already existed and was skipped, or nothing changed)."
          fi
